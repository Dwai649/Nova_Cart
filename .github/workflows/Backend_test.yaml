name: Backend Validation

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: 
  
jobs:
  backend-test-and-build:
    runs-on: ubuntu-latest
   
   

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r novacart/backend/requirements.txt

   
      - name: Run backend tests
        run: |
          pytest novacart/backend/tests/test_api.py --maxfail=1 --disable-warnings -q

      
      - name: Build backend Docker image
        run: |
          docker build \
            -t my-backend:pr-${{ github.sha }} \
            ./novacart/backend
