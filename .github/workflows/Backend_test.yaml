name: Backend Validation and build

on:
  pull_request:
    branches: ["main"]
    paths: ["novacart/backend/**"]
  push:
    branches: ["main"]
    paths: ["novacart/backend/**"]
  # Lets the infra apply workflow invoke this as a job and wait for it,
  # rather than firing it and hoping. Existing triggers above are untouched -
  # a direct backend-code push still runs this exactly as it did before.
 

concurrency:
   group: backend-deploy-${{ github.ref }
   cancel-in-progress: false


jobs:
  backend-test-and-build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r novacart/backend/requirements.txt
          pip install pytest
          pip install httpx

      - name: Run backend tests
        run: |
          PYTHONPATH=novacart/backend pytest novacart/backend/tests/test_api.py --maxfail=1 --disable-warnings -q

      - id: tag
        run: |
          if [ -z "$TAG" ]; then
            TAG="v1.0.0_pr-${{ github.sha }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Only push a real image on main - a PR from within this repo still
      # has secrets available and would otherwise push an image on every
      # backend-touching PR, most of which never get deployed.
   
      - name: Log in to Azure Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          # Use your exact same Service Principal secrets
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      

      
        

      - name: Build and push backend Docker image
        if: github.event_name != 'pull_request'
        run: |
          docker build \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/my-backend:${{ steps.tag.outputs.tag }} \
            ./novacart/backend
          
          docker push \
            ${{ secrets.ACR_LOGIN_SERVER }}/my-backend:${{ steps.tag.outputs.tag }}

      - name: Azure Login
        if: github.event_name != 'pull_request'
        uses: azure/login@v2
        with:
          creds: |
              {
              "clientId": "${{ secrets.ARM_CLIENT_ID }}",
              "clientSecret": "${{ secrets.ARM_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.ARM_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.ARM_TENANT_ID }}"
              }
        
      - name: Update ACA Revision
        if: github.event_name != 'pull_request'
        run: |
            az containerapp update \
            --name backend \
            --resource-group RG-NOVACART-DEV \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/my-backend:${{ steps.tag.outputs.tag }}