name: Backend Validation and build

on:
  pull_request:
    branches: ["main"]
    paths: ["novacart/backend/**"]
  push:
    branches: ["main"]
    paths: ["novacart/backend/**"] 
  

  
jobs:
  backend-test-and-build:
    runs-on: ubuntu-latest
   
   

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r novacart/backend/requirements.txt
          pip install pytest 
          pip install httpx

   
      
      - name: Start FastAPI app
        run: |
         cd novacart/backend
         python -m uvicorn app.main:app --host 127.0.0.1 --port 8080 &
         echo $! > backend.pid


      - name: Wait for backend to be healthy 
        run: |
         for i in {1..20}; do 
          if [[ curl -f http://127.0.0.1:8080/health ]]; then
             echo "Backend is up and healthy"
             break
          fi
          sleep 2
         done
      
      - name: test runtime 
        run: |
          response = ${curl -s http://127.0.0.1:8080/api/runtime}
          echo "$response"


     # - name: Run backend tests
    #  run: |
     #     PYTHONPATH=novacart/backend pytest novacart/backend/tests/test_api.py --maxfail=1 --disable-warnings -q
         


      - name: Build backend Docker image
        run: |
          docker build \
            -t my-backend:pr-${{ github.sha }} \
            ./novacart/backend

      
