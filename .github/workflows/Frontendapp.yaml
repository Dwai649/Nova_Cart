name: Frontend Build

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: ["main"] 
  
jobs:
  backend-test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build docker image
        run: |
          docker build \
            -t frontendimg:pr-${{ github.sha }} \
            ./novacart/frontend
      
   