services:
  frontend:
    build: ./frontend
    container_name: frontend
    env_file: ./frontend/.env
    ports:
      - "8081:8081"
    networks:
      - app-network
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: backend
    env_file: ./backend/.env
    ports:
      - "8080:8080"
    networks:
      - app-network
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-network 

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge