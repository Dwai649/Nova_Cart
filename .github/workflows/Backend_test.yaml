name: Backend Validation and build

on:
  pull_request:
    branches: ["main"]
    paths: ["novacart/backend/**"]
  push:
    branches: ["main"]
    paths: ["novacart/backend/**"] 
  

  
jobs:
  backend-test-and-build:
    runs-on: ubuntu-latest
   
   

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r novacart/backend/requirements.txt
          pip install pytest 
          pip install httpx

      - name: Run backend tests
        run: |
          PYTHONPATH=novacart/backend pytest novacart/backend/tests/test_api.py --maxfail=1 --disable-warnings -q
         
      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}


      - name: Build and push backend Docker image
        run: |
          docker build \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/my-backend:pr-${{ github.sha }} \
            ./novacart/backend &&  \
          docker push \
               ${{ secrets.ACR_LOGIN_SERVER }}/my-backend:pr-${{ github.sha }}  

      
