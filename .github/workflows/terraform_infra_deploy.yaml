name: Terraform plan and apply

on:
  pull_request:
    branches: [main]
    paths:
      - "**.tf"
      - "**.tfvars"
      - ".github/workflows/terraform-*.yml"
  push:
    branches: [main]
    paths:
      - "**.tf"
      - "**.tfvars"
      - ".github/workflows/terraform-*.yml"
  
      

permissions:
  contents: read
  pull-requests: write 
  actions: write        
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}

jobs:
 
  # ---------------------------------------------------------------------
 

  
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./azure_infra/novacart-dev
    env:
      TF_VAR_administrator_password: ${{ secrets.PG_ADMIN_PASSWORD }}
      TF_VAR_backend_image_tag: ${{ vars.BACKEND_IMAGE_TAG }}
      #TF_VAR_frontend_image_tag: ${{ vars.FRONTEND_IMAGE_TAG }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: true

      - run: terraform fmt -check -recursive
      - run: terraform init -input=false
      - run: terraform validate

      - name: Plan
        id: plan
        run: terraform plan -input=false -no-color -out=tfplan
        continue-on-error: true



      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

      

  # ---------------------------------------------------------------------
  # Apply - only on push/dispatch. Re-plans rather than reusing plan's
  # saved file, since that predates this run's fresh backend tag.
  # ---------------------------------------------------------------------
  apply:
    needs: [plan]
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      needs.plan.result == 'success' 
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: ./azure_infra/novacart-dev
    env:
      TF_VAR_administrator_password: ${{ secrets.PG_ADMIN_PASSWORD }}
      TF_VAR_backend_image_tag: ${{ vars.BACKEND_IMAGE_TAG }}
      
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Confirm image tags are set
        run: |
          if [ -z "$TF_VAR_backend_image_tag" ]; then
            echo "Missing an image tag - BACKEND_IMAGE_TAG/FRONTEND_IMAGE_TAG repo variables must be set at least once." >&2
            exit 1
          fi
          echo "Backend:  $TF_VAR_backend_image_tag"
     

      - run: terraform init -input=false
      - run: terraform plan -input=false -out=tfplan
      - run: terraform apply -input=false -auto-approve tfplan

      

      - name: Show outputs
        run: |
          echo "Frontend: $(terraform output -raw frontend_url)"
          echo "Backend:  $(terraform output -raw backend_internal_fqdn)"