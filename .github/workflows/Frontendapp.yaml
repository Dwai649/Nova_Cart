name: Frontend Build

on:
  pull_request:
    branches: ["main"]
    paths: ["novacart/frontend/**"]
  push:
    branches: ["main"] 
    paths: ["novacart/frontend/**"]
  
jobs:
  backend-test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      
      - name: Build docker image
        run: |
          run: |
          docker build \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/frontendimg:v1.0.0_pr-${{ github.sha }} \
            ./novacart/backend &&  \
          docker push \
               ${{ secrets.ACR_LOGIN_SERVER }}/frontendimg:v1.0.0_pr-${{ github.sha }}  
   