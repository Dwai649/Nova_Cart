name: Backend Validation

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: 
  
jobs:
  backend-test-and-build:
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      API_VERSION: v1
      LOG_LEVEL: INFO
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      DATABASE_URL: postgresql://${{secrets.POSTGRES_USER}}:${{secrets.POSTGRES_PASSWORD}}@db:5432/${{secrets.POSTGRES_DB}} 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 2. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      # 3. Run backend tests
      - name: Run backend tests
        run: |
          pytest backend/tests/test_api.py --maxfail=1 --disable-warnings -q

      # 4. Build Docker image (only runs if tests succeed)
      - name: Build backend Docker image
        run: |
          docker build \
            --build-arg POSTGRES_USER=$POSTGRES_USER \
            --build-arg POSTGRES_PASSWORD=$POSTGRES_PASSWORD \
            --build-arg POSTGRES_DB=$POSTGRES_DB \
            --build-arg DATABASE_URL=$DATABASE_URL \
            -t my-backend:pr-${{ github.sha }} \
            ./backend
